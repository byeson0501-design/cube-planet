<!-- index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>六面体星球示例</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app"></div>

  <div class="loader">
    <div class="loader-track"><div class="loader-fill"></div></div>
    <div class="loader-text">加载星球…</div>
  </div>

  <div class="hud">
    <div>
      <div class="brand">CUBE WORLD</div>
      <div class="face-card">
        <h1 data-face-title>加载中…</h1>
        <p data-culture></p>
        <p data-gravity></p>
        <p data-being></p>
      </div>
    </div>
    <div class="legend">
      WASD 移动 · 空格 跳跃<br />
      Shift 加速 · 鼠标 视角
    </div>
  </div>

  <div class="start-prompt">点击屏幕开始 · 移动鼠标环顾四周</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
